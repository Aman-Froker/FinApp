plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.finapp'
version = '0.1.0'

android {
  namespace "expo.modules.smsinbox"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // HeadlessJsTaskService, for the SMS task that runs while the app is closed.
  implementation 'com.facebook.react:react-android'
}
